name: Sync upstream OpenList

on:
  schedule:
    # 每周一 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      create_pr:
        description: "有冲突或默认时开 PR（true）/ 仅尝试直推 main（false，不推荐）"
        required: false
        default: "true"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge OpenListTeam/OpenList → CAS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CAS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "OpenList-CAS Sync"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/OpenListTeam/OpenList.git || true
          git fetch upstream main

      - name: Merge upstream/main
        id: merge
        run: |
          set +e
          git checkout main
          git merge upstream/main --allow-unrelated-histories --no-edit \
            -m "chore: sync upstream OpenList $(date -u +%Y-%m-%d)"
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "conflict=true" >> "$GITHUB_OUTPUT"

          # 冲突时：CAS 关键文件一律保留 ours
          PRESERVE=(
            internal/bootstrap/data/user.go
            internal/casmeta
            internal/driver/cas.go
            drivers/local/cas.go
            drivers/local/meta.go
            drivers/189pc
            drivers/onedrive/driver.go
            drivers/onedrive/meta.go
            drivers/onedrive/util.go
            drivers/onedrive_app/driver.go
            drivers/onedrive_app/meta.go
            drivers/onedrive_app/util.go
            README.md
            README_CAS.md
            .github/workflows/beta_release.yml
            .github/workflows/build.yml
            .github/workflows/sync_upstream.yml
          )
          for p in "${PRESERVE[@]}"; do
            if [ -e "$p" ] || git ls-files --unmerged -- "$p" | grep -q .; then
              git checkout --ours -- "$p" 2>/dev/null || true
              git add -A -- "$p" 2>/dev/null || true
            fi
          done

          # 其余冲突文件：优先上游（获取官方修复），若仍冲突则 ours
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            git checkout --theirs -- "$f" 2>/dev/null || git checkout --ours -- "$f" 2>/dev/null || true
            git add -- "$f" 2>/dev/null || true
          done < <(git diff --name-only --diff-filter=U)

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "仍有无法自动解决的冲突，需要人工处理"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git commit --no-edit -m "chore: sync upstream OpenList (auto-resolve, preserve CAS) $(date -u +%Y-%m-%d)" || true

      - name: Verify CAS markers
        run: |
          set -e
          grep -q "random.String(8)" internal/bootstrap/data/user.go
          grep -q "SnippetProxy" drivers/onedrive/meta.go
          grep -q "GetFileById" drivers/onedrive/util.go
          test -f internal/casmeta/casmeta.go
          test -f drivers/local/cas.go
          ls drivers/189pc/cas_*.go >/dev/null
          echo "CAS markers OK"

      - name: Push main
        if: steps.merge.outputs.conflict != 'true' || true
        run: |
          git push origin main

      - name: Summary
        run: |
          echo "Synced upstream OpenList into main."
          git log -1 --oneline
