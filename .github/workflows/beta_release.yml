name: Beta Release builds

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  changelog:
    name: Beta Release Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Create or update ref
        uses: ovsds/create-or-update-ref-action@f66e3f24fa250e50da7d3e599bae67bc3f749a5e # v1
        with:
          ref: tags/beta
          sha: ${{ github.sha }}

      - name: Delete beta tag
        run: git tag -d beta
        continue-on-error: true

      - name: changelog
        run: |
          git tag -l
          npx changelogithub --output CHANGELOG.md

      - name: Upload assets to beta release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view beta; then
            gh release create beta --prerelease --notes-file CHANGELOG.md --title "OpenList-CAS beta"
          else
            gh release edit beta --prerelease --notes-file CHANGELOG.md --title "OpenList-CAS beta"
          fi
          gh release upload beta "CHANGELOG.md" --clobber

  compile-check:
    name: Compile check (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"

      - name: Compile
        run: go build -trimpath -ldflags="-s -w" -tags=jsoniter -o /tmp/openlist-check .
        env:
          CGO_ENABLED: "0"

  release-amd64-arm64:
    name: Release ${{ matrix.target }}
    needs:
      - changelog
      - compile-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64-musl
            asset: openlist-linux-amd64.tar.gz
          - target: linux-arm64-musl
            asset: openlist-linux-arm64.tar.gz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Setup Node for frontend overlay
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup web (official frontend + i18n + compress overlay)
        run: |
          set -euo pipefail
          FE_REPO="${FRONTEND_REPO:-OpenListTeam/OpenList-Frontend}"
          git clone --depth 1 "https://github.com/${FE_REPO}.git" /tmp/openlist-frontend
          # Official repo only ships English sources; full locales are on edge/i18n.tar.gz
          curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -o /tmp/i18n.tar.gz             "https://github.com/${FE_REPO}/releases/download/edge/i18n.tar.gz"
          tar -xzf /tmp/i18n.tar.gz -C /tmp/openlist-frontend/src/lang
          ls /tmp/openlist-frontend/src/lang | head
          # Ensure zh-CN has compress strings (fallback to English keys if missing)
          python3 - <<'PY'
          import json
          from pathlib import Path
          for loc, compress, name in [
              ("zh-CN", "压缩", "压缩包名称："),
              ("zh-TW", "壓縮", "壓縮檔名稱："),
              ("en", "Compress", "Archive name:"),
          ]:
              p = Path(f"/tmp/openlist-frontend/src/lang/{loc}/home.json")
              if not p.exists():
                  continue
              d = json.loads(p.read_text(encoding="utf-8-sig"))
              tb = d.setdefault("toolbar", {})
              tb.setdefault("compress", compress)
              tb.setdefault("compress-name", name)
              p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + "
", encoding="utf-8")
          print("i18n compress keys ok")
          PY
          bash frontend-overlay/apply-frontend-overlay.sh /tmp/openlist-frontend
          cd /tmp/openlist-frontend
          corepack enable
          pnpm install --frozen-lockfile || pnpm install
          # rebuild entry after i18n lands
          node ./scripts/i18n.mjs || true
          pnpm run build
          rm -rf "${GITHUB_WORKSPACE}/public/dist"
          mkdir -p "${GITHUB_WORKSPACE}/public/dist"
          cp -a dist/. "${GITHUB_WORKSPACE}/public/dist/"
          # sanity: zh-CN chunk or locale presence
          if ! grep -R -l "登录\|Login" "${GITHUB_WORKSPACE}/public/dist" >/dev/null 2>&1; then
            echo "warn: could not verify locale strings in dist"
          fi
          echo "WebVersion=rolling-compress" >> "$GITHUB_ENV"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_REPO: ${{ vars.FRONTEND_REPO }}

      - name: Build (stripped + static musl)
        uses: OpenListTeam/cgo-actions@d760a8ec1a6be1f8ec181229e11cb2671797f9e0 # v1.3.0
        with:
          targets: ${{ matrix.target }}
          # -s -w: strip symbol table & DWARF (major size cut)
          # musl static link flags kept for portable binary
          flags: "-ldflags=-s -w -linkmode external -extldflags '-static -fpic'"
          static-link-for-musl: true
          musl-target-format: $os-$musl-$arch
          github-token: ${{ secrets.GITHUB_TOKEN }}
          out-dir: build
          output: openlist
          musl-base-url: "https://github.com/OpenListTeam/musl-compilers/releases/latest/download/"
          x-flags: |
            github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=$built_at
            github.com/OpenListTeam/OpenList/v4/internal/conf.GitAuthor=The OpenList Projects Contributors <noreply@oplist.org>
            github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=$git_commit
            github.com/OpenListTeam/OpenList/v4/internal/conf.Version=$tag
            github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=rolling
        env:
          GOFLAGS: "-trimpath -tags=jsoniter"

      - name: Verify static binary & size
        run: |
          set -e
          BIN=build/openlist
          if [ ! -f "$BIN" ]; then
            echo "binary missing"; ls -la build/ || true; exit 1
          fi
          if readelf -l "$BIN" | grep -q "Requesting program interpreter"; then
            echo "Dynamic binary detected: $BIN"
            readelf -l "$BIN" | grep "Requesting program interpreter" || true
            exit 1
          fi
          echo "=== before strip/upx ==="
          ls -lh "$BIN"
          file "$BIN"

      - name: Extra strip (safe no-op if already stripped)
        run: |
          set -e
          BIN=build/openlist
          strip --strip-all "$BIN" 2>/dev/null || strip -s "$BIN" 2>/dev/null || true
          echo "=== after strip ==="
          ls -lh "$BIN"

      - name: UPX compress
        run: |
          set -e
          BIN=build/openlist
          sudo apt-get update -qq
          sudo apt-get install -y -qq upx-ucl || sudo apt-get install -y -qq upx
          # -9: best compression; --lzma often smaller for Go binaries
          upx -9 --lzma "$BIN" || upx -9 "$BIN"
          echo "=== after UPX ==="
          ls -lh "$BIN"
          file "$BIN"

      - name: Package
        run: |
          set -e
          mkdir -p dist
          tar -czf "dist/${{ matrix.asset }}" -C build openlist
          (cd dist && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")
          echo "=== package ==="
          ls -lh dist/

      - name: Upload to beta Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload beta "dist/${{ matrix.asset }}" "dist/${{ matrix.asset }}.sha256" --clobber

