name: Beta Release builds

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  changelog:
    name: Beta Release Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Create or update ref
        id: create-or-update-ref
        uses: ovsds/create-or-update-ref-action@f66e3f24fa250e50da7d3e599bae67bc3f749a5e # v1
        with:
          ref: tags/beta
          sha: ${{ github.sha }}

      - name: Delete beta tag
        run: git tag -d beta
        continue-on-error: true

      - name: changelog
        id: changelog
        run: |
          git tag -l
          npx changelogithub --output CHANGELOG.md

      - name: Upload assets to beta release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view beta; then
            gh release create beta --prerelease --notes-file CHANGELOG.md
          else
            gh release edit beta --prerelease --notes-file CHANGELOG.md
          fi
          gh release upload beta "CHANGELOG.md" --clobber

      - name: Upload assets to github artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: beta changelog
          path: ${{ github.workspace }}/CHANGELOG.md
          compression-level: 0
          if-no-files-found: error

  compile-check:
    name: Compile check (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"

      - name: Compile
        run: go build -o /tmp/openlist-check .
        env:
          CGO_ENABLED: "0"

  # After compile succeeds: build linux amd64 + arm64 and publish to beta Release
  release-amd64-arm64:
    name: Release ${{ matrix.target }}
    needs:
      - changelog
      - compile-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64-musl
            asset: openlist-linux-amd64.tar.gz
          - target: linux-arm64-musl
            asset: openlist-linux-arm64.tar.gz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Setup web
        run: bash build.sh dev web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_REPO: ${{ vars.FRONTEND_REPO }}

      - name: Build
        uses: OpenListTeam/cgo-actions@d760a8ec1a6be1f8ec181229e11cb2671797f9e0 # v1.3.0
        with:
          targets: ${{ matrix.target }}
          flags: "-ldflags=-linkmode external -extldflags '-static -fpic'"
          static-link-for-musl: true
          musl-target-format: $os-$musl-$arch
          github-token: ${{ secrets.GITHUB_TOKEN }}
          out-dir: build
          output: openlist
          musl-base-url: "https://github.com/OpenListTeam/musl-compilers/releases/latest/download/"
          x-flags: |
            github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=$built_at
            github.com/OpenListTeam/OpenList/v4/internal/conf.GitAuthor=The OpenList Projects Contributors <noreply@oplist.org>
            github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=$git_commit
            github.com/OpenListTeam/OpenList/v4/internal/conf.Version=$tag
            github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=rolling

      - name: Verify static binary
        run: |
          set -e
          BIN=build/openlist
          if [ ! -f "$BIN" ]; then
            ls -la build/ || true
            echo "binary missing"
            exit 1
          fi
          if readelf -l "$BIN" | grep -q "Requesting program interpreter"; then
            echo "Dynamic binary detected: $BIN"
            readelf -l "$BIN" | grep "Requesting program interpreter" || true
            exit 1
          fi
          file "$BIN"
          ls -lh "$BIN"

      - name: Package
        run: |
          set -e
          mkdir -p dist
          tar -czf "dist/${{ matrix.asset }}" -C build openlist
          (cd dist && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")
          ls -lh dist/

      - name: Upload to beta Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload beta "dist/${{ matrix.asset }}" "dist/${{ matrix.asset }}.sha256" --clobber

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          compression-level: 0
          if-no-files-found: error

  # Full multi-platform matrix only on manual dispatch
  release-full:
    if: github.event_name == 'workflow_dispatch'
    needs:
      - changelog
      - compile-check
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - target: windows-amd64
          - target: windows-arm64
          - target: darwin-amd64
          - target: darwin-arm64
          - target: linux-amd64
          - target: linux-arm64
    name: Full Release ${{ matrix.target }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: Setup web
        run: bash build.sh dev web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_REPO: ${{ vars.FRONTEND_REPO }}

      - name: Build
        uses: OpenListTeam/cgo-actions@d760a8ec1a6be1f8ec181229e11cb2671797f9e0 # v1.3.0
        with:
          targets: ${{ matrix.target }}
          flags: "-ldflags="
          github-token: ${{ secrets.GITHUB_TOKEN }}
          out-dir: build
          output: openlist$ext
          x-flags: |
            github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=$built_at
            github.com/OpenListTeam/OpenList/v4/internal/conf.GitAuthor=The OpenList Projects Contributors <noreply@oplist.org>
            github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=$git_commit
            github.com/OpenListTeam/OpenList/v4/internal/conf.Version=$tag
            github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=rolling

      - name: Package
        run: |
          set -e
          mkdir -p dist
          cd build
          if [ -f openlist.exe ]; then
            zip -9 "../dist/openlist-${{ matrix.target }}.zip" openlist.exe
          else
            tar -czf "../dist/openlist-${{ matrix.target }}.tar.gz" openlist
          fi
          cd ..
          (cd dist && sha256sum * > checksums.txt || true)
          ls -lh dist/

      - name: Upload to beta Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in dist/*; do
            gh release upload beta "$f" --clobber
          done

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openlist-${{ matrix.target }}
          path: dist/*
          compression-level: 0
